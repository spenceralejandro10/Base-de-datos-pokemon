name: Actualizar precios TCGplayer (11-11-2026)
on:
  push:
    paths:
      - index.html
  workflow_dispatch:
permissions:
  contents: write
jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Descargar precios Market Price de TCGCSV
        run: python scripts/update-prices.py
      - name: Usar TRM oficial de Colombia del 11 de noviembre de 2026
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("market-snapshot.js")
          raw = path.read_text(encoding="utf-8")
          prefix = "/* TCGplayer Market Price via TCGCSV; read-only fallback. */\nwindow.MARKET_SNAPSHOT="
          obj = json.loads(raw[len(prefix):].removesuffix(";\n"))
          obj["fx"] = {"cop": 3297.07, "updatedAt": "2026-11-11T12:00:00-05:00"}
          path.write_text(prefix + json.dumps(obj, ensure_ascii=False, separators=(",", ":")) + ";\n", encoding="utf-8")
          PY
      - name: Publicar precios
        run: |
          if ! git diff --quiet -- market-snapshot.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add market-snapshot.js
            git commit -m "Refresh TCGplayer Market Price and official COP rate 2026-11-11"
            git push
          fi
