name: Completar precios verificables
on:
  push:
    paths:
      - market-prices.js
  workflow_dispatch:
permissions:
  contents: write
jobs:
  precios:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Actualizar precios en todas las expansiones del catálogo
        run: python scripts/update-prices.py
      - name: Mantener la tasa de cambio USD/COP utilizada por la colección
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path=Path("market-snapshot.js")
          raw=path.read_text(encoding="utf-8")
          prefix="/* TCGplayer Market Price via TCGCSV; read-only fallback. */\nwindow.MARKET_SNAPSHOT="
          obj=json.loads(raw[len(prefix):].rstrip().removesuffix(";"))
          obj["fx"]={"cop":3297.07,"updatedAt":"2026-11-11T12:00:00-05:00"}
          path.write_text(prefix+json.dumps(obj,ensure_ascii=False,separators=(",",":"))+";\n",encoding="utf-8")
          PY
      - name: Publicar precios actualizados
        run: |
          if ! git diff --quiet -- market-snapshot.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add market-snapshot.js
            git commit -m "Add TCGplayer market prices for missing card sets"
            git push
          fi
