<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="theme-color" content="#17304f">
  <meta name="description" content="Bóveda TCG. Próximamente más artículos.">
  <title>Bóveda TCG | Próximamente más artículos</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f5f7fa; color: #17304f; }
    header { background: #17304f; padding: 24px clamp(20px, 6vw, 72px); }
    .brand { color: white; font-size: clamp(23px, 3vw, 30px); font-weight: 750; letter-spacing: -.02em; }
    main { min-height: calc(100vh - 85px); display: grid; place-items: center; padding: 32px 20px; }
    .message { width: min(100%, 720px); background: white; border: 1px solid #e3e9ef; border-radius: 22px; box-shadow: 0 12px 36px rgba(23, 48, 79, .06); padding: clamp(42px, 8vw, 92px) 24px; text-align: center; }
    h1 { margin: 0; font-size: clamp(32px, 6vw, 52px); font-weight: 800; letter-spacing: -.035em; line-height: 1.15; }
    .accent { height: 5px; width: 82px; margin: 28px auto 0; border-radius: 99px; background: #e4b455; }
  </style>
</head>
<body>
  <header><div class="brand">Bóveda TCG</div></header>
  <main>
    <section class="message" aria-label="Aviso de próximos artículos">
      <h1>Próximamente más artículos</h1>
      <div class="accent" aria-hidden="true"></div>
    </section>
  </main>
</body>
</html>
